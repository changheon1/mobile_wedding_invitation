name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Allows manually triggering a deploy from the Actions tab
  workflow_dispatch:

# Grant just the permissions needed to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time, cancel any in-progress run
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path to the folder containing index.html — "." means repo root
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4